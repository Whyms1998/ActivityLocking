name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 原先用 android-actions/setup-android@v3，2026-10 起该步骤在 runner 上稳定失败
      # （安装 cmdline-tools 失败）。改为直接用 runner 镜像预装的 SDK + 显式安装
      # 本项目需要的组件，不再依赖第三方 action 的内部实现。
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || SDK=/usr/local/lib/android/sdk
          echo "SDK root: $SDK"
          ls "$SDK" || true

          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            for c in "$SDK"/cmdline-tools/*/bin/sdkmanager "$SDK"/tools/bin/sdkmanager; do
              if [ -x "$c" ]; then SDKM="$c"; break; fi
            done
          fi
          if [ -z "$SDKM" ]; then
            echo "::error::sdkmanager not found under $SDK"
            exit 1
          fi
          echo "sdkmanager: $SDKM"

          yes | "$SDKM" --licenses > /dev/null 2>&1 || true

          # compileSdk = 36；AGP 8.5.2 的默认 build-tools 是 34.0.0
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;34.0.0" 2>&1 | tail -20

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -x lintVitalRelease -x lintVitalAnalyzeRelease

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      # tag 推送时自动挂 Release。release 构建用的是 runner 临时生成的 debug 签名，
      # 与开发者本机产物的签名不同，因此只能装给新用户；老用户升级请用同签名安装包覆盖。
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
